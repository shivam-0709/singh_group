{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Simple Shopping Site</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <!-- 🔼 Top Section -->
    <div class="top-section">
        <h1>Welcome to Shivam Singh Store</h1>
        <p>Best products at best prices</p>
    </div>

    <!-- 🔽 Bottom Section -->
    <div class="bottom-section">
        <h2>Available Items</h2>
        <div class="items">
            {% for i in items %}
                <div class="item">
                    <img src="{% static i.image %}" alt="{{ i.name }}">
                    <h3>{{ i.name }}</h3>
                    <p>₹{{ i.price }}</p>
                    <p>{{ i.desc }}</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
